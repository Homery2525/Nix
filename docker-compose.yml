services:
  nix:
    build: .
    container_name: nix
    restart: unless-stopped
    ports:
      - "127.0.0.1:${JARVIS_PORT:-8080}:8080"   # solo accesible desde su propio equipo
    environment:
      TZ: ${TZ:-UTC}                             # zona horaria del núcleo
      JARVIS_TRATO: ${JARVIS_TRATO:-señor}
    volumes:
      - nix_datos:/data                          # tareas, notas y closet: sobreviven a reinicios y actualizaciones

volumes:
  nix_datos:
